plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.tunton'
version = '0.1.0'

android {
  namespace "expo.modules.tuntonsms"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
  testOptions {
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  // DR7: BackoffTest checks the gateway's retry waits
  testImplementation 'junit:junit:4.13.2'
}
