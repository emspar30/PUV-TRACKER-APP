# The SMS worker (DR6) on Render, so it runs without the team PC and the gateway phone reaches it
# over HTTPS from anywhere. See services/sms-worker/README.md, "Hosted on Render".
# The secrets are typed into the Render dashboard (sync: false) and never stored in this file.
services:
  - type: web
    name: tunton-sms-worker
    runtime: node
    plan: free
    # Closest Render region to the Philippines
    region: singapore
    buildCommand: npm ci && npm run worker:build
    startCommand: node services/sms-worker/dist/worker.cjs
    healthCheckPath: /healthz
    autoDeploy: true
    # Redeploy only when the worker or the shared rules it bundles change
    buildFilter:
      paths:
        - services/sms-worker/**
        - src/shared/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # data or text, set in the Render dashboard (Environment) so a Blueprint sync never changes it:
      # data normally; text was needed while the gateway sent from a DITO SIM (team test, 2026-10-25)
      - key: SMS_PRIMARY_ENCODING
        sync: false

  # The admin console (DRG5), a static page built from admin/. See admin/README.md, "Hosted on Render".
  # Its two settings are public values (they ship in the apps too) but stay out of this file like the
  # worker's, typed into the Render dashboard once.
  - type: web
    name: tunton-admin
    runtime: static
    buildCommand: npm ci && npm run admin:build
    staticPublishPath: admin/dist
    autoDeploy: true
    buildFilter:
      paths:
        - admin/**
        - src/shared/**
        - src/strings/**
        - src/theme/tokens.ts
        - supabase/functions/_shared/**
        - package.json
        - package-lock.json
        - render.yaml
    headers:
      # Only the page itself and the Supabase project may be reached; no inline script or style
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self' https://*.supabase.co; img-src 'self' data: https://*.supabase.co; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'"
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Robots-Tag
        value: noindex
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
